name: CI

permissions: {}

# Push runs are release evidence: the release engine reads the push run of the
# exact contracts commit and its contract-build-<commit> artifact. They run only
# on the integration and release branches; a task branch is checked by its
# pull request instead.
on:
  push:
    branches:
      - develop
      - sandbox
      - main
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

# Every push run has its own group and is never cancelled. A newer pull request
# or manual run on the same ref cancels the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && format('push-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    name: Foundry project
    # The repository variable CONTRACTS_BUILD_RUNNER may name a larger
    # GitHub-hosted runner for the via-IR build; unset, this is ubuntu-latest.
    runs-on: ${{ vars.CONTRACTS_BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Check build export tooling
        run: python3 -m unittest discover -s script -p 'test_*.py'

      # A pull request restores its own cache, else its base branch's (develop
      # for task branches): the exact inputs first, else the newest cache with
      # the same configuration, from which Forge recompiles only changed inputs.
      - name: Restore compiler outputs
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-${{ runner.arch }}-forge-v1.5.1-${{ hashFiles('foundry.toml', '.gitmodules') }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'lib/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-v1.5.1-${{ hashFiles('foundry.toml', '.gitmodules') }}-

      - name: Run Forge build
        run: forge build --sizes

      # Saved as soon as the build succeeds, so a later failing step still
      # leaves the compiled inputs for the next run on this ref.
      - name: Save compiler outputs
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            out
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Export contract ABIs
        run: python3 script/export_release_build.py --commit "${{ github.sha }}" --abi-target abi-export

      - name: Upload contract ABIs
        uses: actions/upload-artifact@v7
        with:
          name: contract-abi-${{ github.sha }}
          path: abi-export/
          if-no-files-found: error
          retention-days: 90

      # The release engine deploys and verifies implementations from exactly
      # these bytes (script/export_release_build.py); it never rebuilds them.
      - name: Upload the release build
        uses: actions/upload-artifact@v7
        with:
          name: contract-build-${{ github.sha }}
          path: build-export/
          if-no-files-found: error
          retention-days: 90

      - name: Check upgradeable storage layouts
        run: python3 script/check_storage_layout.py --artifacts out

      - name: Run Forge tests
        run: forge test -vvv

  coverage:
    name: Forge coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # Coverage compiles with its own settings and, on Forge v1.5.1, without
      # reading or writing a compiler cache, so there is nothing to restore; the
      # separate directories keep it away from the normal build's outputs.
      - name: Run Forge coverage
        env:
          FOUNDRY_OUT: coverage-out
          FOUNDRY_CACHE_PATH: coverage-cache
        run: >-
          forge coverage --skip script --exclude-tests
          --no-match-coverage 'script/'
          --report summary

  security:
    name: Slither analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-slither.txt
          python -m pip check

      - name: Run Slither
        run: slither . --filter-paths "lib/|test/|script/" --fail-high

  handoff:
    name: Release hand-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release hand-off trailers
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          node scripts/check-release-trailers.mjs --range "$range"
