name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Export contract ABIs
        run: |
          rm -rf abi-export
          mkdir abi-export
          for name in AgentIndex ProviderRegistry ServiceRegistry ValidationRegistry \
            ReputationStorage OutcomeSplitter OutcomeSplitterFactory; do
            forge inspect "$name" abi --json > "abi-export/$name.json"
          done
          python3 - abi-export/*.json <<'EOF'
          import json
          import sys

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  abi = json.load(handle)
              if not isinstance(abi, list) or not abi:
                  raise SystemExit(f"{path}: expected a non-empty ABI array")
              print(f"{path}: {len(abi)} ABI entries")
          EOF

      - name: Upload contract ABIs
        uses: actions/upload-artifact@v7
        with:
          name: contract-abi-${{ github.sha }}
          path: abi-export/
          if-no-files-found: error
          retention-days: 90

      - name: Check upgradeable storage layouts
        run: python3 script/check_storage_layout.py

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage
        run: >-
          forge coverage --skip script --exclude-tests
          --no-match-coverage 'script/'
          --report summary

  security:
    name: Slither analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        with:
          fail-on: high
          slither-version: 0.11.5
          slither-args: --filter-paths "lib/|test/|script/"
