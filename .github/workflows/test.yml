name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      - name: Test release verifier
        run: python3 -m unittest discover -s script/tests -v

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Check upgradeable storage layouts
        run: python3 script/check_storage_layout.py

      - name: Run Forge tests
        run: forge test --no-match-path 'test/fork/*' -vvv

      - name: Run Forge coverage
        run: >-
          forge coverage --ir-minimum --exclude-tests
          --no-match-path 'test/fork/*'
          --no-match-coverage 'script/'
          --report summary

  security:
    name: Slither analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        with:
          fail-on: high
          slither-version: 0.11.5
          slither-args: --filter-paths "lib/|test/|script/"
