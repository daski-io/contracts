name: Release Circle fork gate

permissions: {}

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      BASE_MAINNET_RPC_URL:
        required: true
      BASE_SEPOLIA_RPC_URL:
        required: true

jobs:
  circle-forks:
    name: Pinned Circle USDC forks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Require archival RPC credentials
        run: |
          test -n "$BASE_MAINNET_RPC_URL"
          test -n "$BASE_SEPOLIA_RPC_URL"

      - name: Preflight Base Mainnet pinned state
        run: >-
          python3 script/preflight_fork_rpc.py
          --rpc-url "$BASE_MAINNET_RPC_URL"
          --chain-id 8453
          --block 49316000
          --block-hash 0x12dc1218fc226c8a2521ff2f7349c461a01189476e389fb24ab5d994f1155f32
          --token 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
          --name "USD Coin"
          --version 2
          --domain-separator 0x02fa7265e7c5d81118673727957699e4d68f74cd74b7db77da710fe8a2c7834f
          2>&1 | tee base-mainnet-preflight.log

      - name: Preflight Base Sepolia pinned state
        run: >-
          python3 script/preflight_fork_rpc.py
          --rpc-url "$BASE_SEPOLIA_RPC_URL"
          --chain-id 84532
          --block 44827000
          --block-hash 0xc3c39329b0aa5b0eec61dc2d6933c3e05e7c1dd6de888622a25639731dd38dd5
          --token 0x036CbD53842c5426634e7929541eC2318f3dCF7e
          --name USDC
          --version 2
          --domain-separator 0x71f17a3b2ff373b803d70a5a07c046c1a2bc8e89c09ef722fcb047abe94c9818
          2>&1 | tee base-sepolia-preflight.log

      - name: Run production x402 fork suites
        run: forge test --match-path 'test/fork/*' -vvv 2>&1 | tee circle-fork-tests.log

      - name: Archive fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circle-fork-evidence-${{ github.sha }}
          path: |
            base-mainnet-preflight.log
            base-sepolia-preflight.log
            circle-fork-tests.log
            cache/
            broadcast/
          if-no-files-found: ignore
          retention-days: 90
