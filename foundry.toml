[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
# The reputation tree uses custom errors, so the sizes gate has headroom at 200 runs.
optimizer_runs = 200
extra_output = ["ir"]
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "/tmp" },
    { access = "read-write", path = "/tmp/daski-release-e2e" },
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true
