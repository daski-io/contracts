[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# ERC-8004 ReputationRegistry emits NewFeedback with 11 args; the string
# parameters push the stack over the 16-slot limit without via_ir.
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
