[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
# via_ir retained: the deployed bytecode has always been compiled with it,
# and wide call surfaces (X402Adapter.settleWithRegistration, the 7-arg
# PaymentRouter.settle) sit near the 16-slot stack limit without it.
via_ir = true
optimizer = true
optimizer_runs = 200
extra_output = ["ir"]
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "/tmp" },
    { access = "read-write", path = "/tmp/daski-release-e2e" },
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true
