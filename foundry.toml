[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
# 100 keeps ReputationStorage inside the EIP-170 runtime limit — at 200 the
# CI sizes gate fails (24,700 B runtime, 124 over). Raising runs again needs
# that headroom back first (custom-error conversion frees far more).
optimizer_runs = 100
extra_output = ["ir"]
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "/tmp" },
    { access = "read-write", path = "/tmp/daski-release-e2e" },
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true
